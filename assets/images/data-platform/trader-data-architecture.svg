<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Trader Data Platform architecture</title>
  <desc id="desc">Admin, Go Controller, PostgreSQL outbox, Kafka, Python collectors and ETL workers, raw storage and normalized tables.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="690" fill="#0b1220"/>
  <text x="48" y="55" fill="#f8fafc" font-size="30" font-family="Arial, sans-serif" font-weight="700">Trader Data Platform</text>
  <text x="48" y="87" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">Control plane과 data plane을 분리하고 DB에 처리 상태를 남기는 구조</text>

  <rect x="40" y="125" width="1120" height="150" rx="8" fill="#10251f" stroke="#34d399" stroke-width="2"/>
  <text x="64" y="158" fill="#6ee7b7" font-size="17" font-family="Arial, sans-serif" font-weight="700">CONTROL PLANE</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="180" width="190" height="64" rx="6" fill="#18243a" stroke="#64748b"/>
    <text x="165" y="207" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">Admin Page</text>
    <text x="165" y="230" fill="#94a3b8" text-anchor="middle" font-size="14">job, raw, worker 제어</text>
    <rect x="350" y="180" width="220" height="64" rx="6" fill="#12352c" stroke="#34d399"/>
    <text x="460" y="207" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">Go Controller</text>
    <text x="460" y="230" fill="#a7f3d0" text-anchor="middle" font-size="14">policy, lag, heartbeat</text>
    <rect x="660" y="180" width="210" height="64" rx="6" fill="#18243a" stroke="#64748b"/>
    <text x="765" y="207" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">DB Outbox</text>
    <text x="765" y="230" fill="#94a3b8" text-anchor="middle" font-size="14">PENDING -> PUBLISHED</text>
    <rect x="950" y="180" width="170" height="64" rx="6" fill="#18243a" stroke="#64748b"/>
    <text x="1035" y="207" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">Scale Command</text>
    <text x="1035" y="230" fill="#94a3b8" text-anchor="middle" font-size="14">Local / AWS ASG</text>
  </g>

  <line x1="260" y1="212" x2="340" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="212" x2="650" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="226" x2="940" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="305" width="1120" height="100" rx="8" fill="#2a230f" stroke="#fbbf24" stroke-width="2"/>
  <text x="64" y="338" fill="#fde68a" font-size="17" font-family="Arial, sans-serif" font-weight="700">EVENT BUS</text>
  <rect x="285" y="326" width="630" height="58" rx="6" fill="#3b2f12" stroke="#fbbf24" filter="url(#shadow)"/>
  <text x="600" y="352" fill="#f8fafc" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" font-weight="700">Kafka</text>
  <text x="600" y="374" fill="#fde68a" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">jobs.events | raw.kis.ready | raw.bls.ready | raw.sec.ready</text>
  <line x1="765" y1="244" x2="765" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="435" width="540" height="205" rx="8" fill="#10223c" stroke="#60a5fa" stroke-width="2"/>
  <text x="64" y="468" fill="#93c5fd" font-size="17" font-family="Arial, sans-serif" font-weight="700">PYTHON DATA PLANE</text>
  <rect x="75" y="495" width="205" height="105" rx="6" fill="#172c4e" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="177" y="526" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Collector</text>
  <text x="177" y="552" fill="#bfdbfe" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">KIS / BLS / SEC API</text>
  <text x="177" y="575" fill="#94a3b8" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">raw + source_object</text>
  <rect x="340" y="495" width="205" height="105" rx="6" fill="#172c4e" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="442" y="526" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">ETL Worker</text>
  <text x="442" y="552" fill="#bfdbfe" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">normalize / upsert</text>
  <text x="442" y="575" fill="#94a3b8" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">lineage + processed_event</text>

  <rect x="620" y="435" width="540" height="205" rx="8" fill="#2b1720" stroke="#fb7185" stroke-width="2"/>
  <text x="644" y="468" fill="#fda4af" font-size="17" font-family="Arial, sans-serif" font-weight="700">STORAGE &amp; SOURCE OF TRUTH</text>
  <rect x="655" y="495" width="205" height="105" rx="6" fill="#3a1d27" stroke="#fb7185" filter="url(#shadow)"/>
  <text x="757" y="526" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Raw Storage</text>
  <text x="757" y="552" fill="#fecdd3" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">Local / S3</text>
  <text x="757" y="575" fill="#94a3b8" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">storage_key, content_hash</text>
  <rect x="920" y="495" width="205" height="105" rx="6" fill="#3a1d27" stroke="#fb7185" filter="url(#shadow)"/>
  <text x="1022" y="526" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">PostgreSQL</text>
  <text x="1022" y="552" fill="#fecdd3" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">normalized tables</text>
  <text x="1022" y="575" fill="#94a3b8" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">lineage, status, offset</text>

  <line x1="500" y1="384" x2="220" y2="486" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="384" x2="442" y2="486" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="548" x2="330" y2="548" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="565" x2="645" y2="565" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="530" x2="910" y2="530" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="575" x2="910" y2="575" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="670" fill="#64748b" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">DB 상태 + Kafka offset + worker heartbeat를 연결해 운영자가 처리 구간을 판단</text>
</svg>
