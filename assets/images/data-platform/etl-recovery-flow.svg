<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ETL transaction과 Kafka offset commit 사이의 장애 복구 흐름</title>
  <desc id="desc">PROCESSING 상태, ETL 결과, consumer 처리 원장을 구간별로 커밋하고 Kafka offset은 마지막에 커밋하는 복구 설계.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#0b1220"/>
  <text x="40" y="52" fill="#f8fafc" font-size="30" font-family="Arial, sans-serif" font-weight="700">ETL 장애 복구 기준</text>
  <text x="40" y="84" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">ETL 결과와 처리 원장을 먼저 확정하고 Kafka offset은 마지막에 commit</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="40" y="125" width="160" height="84" rx="6" fill="#18243a" stroke="#60a5fa"/>
    <text x="120" y="158" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">Kafka 수신</text>
    <text x="120" y="184" fill="#93c5fd" text-anchor="middle" font-size="13">offset 미커밋</text>

    <rect x="225" y="125" width="160" height="84" rx="6" fill="#18243a" stroke="#60a5fa"/>
    <text x="305" y="158" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">중복 확인</text>
    <text x="305" y="184" fill="#93c5fd" text-anchor="middle" font-size="13">SUCCESS 조회</text>

    <rect x="410" y="125" width="170" height="84" rx="6" fill="#2a2034" stroke="#c084fc"/>
    <text x="495" y="158" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">PROCESSING</text>
    <text x="495" y="184" fill="#e9d5ff" text-anchor="middle" font-size="13">상태 DB commit</text>

    <rect x="605" y="125" width="170" height="84" rx="6" fill="#1d2f2a" stroke="#34d399"/>
    <text x="690" y="153" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">ETL transaction</text>
    <text x="690" y="177" fill="#a7f3d0" text-anchor="middle" font-size="12">upsert + lineage</text>
    <text x="690" y="195" fill="#a7f3d0" text-anchor="middle" font-size="12">PROCESSED commit</text>

    <rect x="800" y="125" width="170" height="84" rx="6" fill="#173044" stroke="#22d3ee"/>
    <text x="885" y="153" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">Consumer ledger</text>
    <text x="885" y="177" fill="#a5f3fc" text-anchor="middle" font-size="12">processed_event</text>
    <text x="885" y="195" fill="#a5f3fc" text-anchor="middle" font-size="12">SUCCESS commit</text>

    <rect x="995" y="125" width="165" height="84" rx="6" fill="#30240f" stroke="#fbbf24"/>
    <text x="1077" y="158" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">Kafka commit</text>
    <text x="1077" y="184" fill="#fde68a" text-anchor="middle" font-size="13">offset 완료</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="200" y1="167" x2="215" y2="167"/>
    <line x1="385" y1="167" x2="400" y2="167"/>
    <line x1="580" y1="167" x2="595" y2="167"/>
    <line x1="775" y1="167" x2="790" y2="167"/>
    <line x1="970" y1="167" x2="985" y2="167"/>
  </g>

  <text x="40" y="286" fill="#f8fafc" font-size="20" font-family="Arial, sans-serif" font-weight="700">Worker 중단 위치에 따른 재수신 분기</text>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="320" width="350" height="260" rx="8" fill="#281820" stroke="#fb7185" stroke-width="2"/>
    <text x="65" y="357" fill="#fda4af" font-size="18" font-weight="700">1. ETL commit 전 중단</text>
    <text x="65" y="400" fill="#e2e8f0" font-size="15">남는 상태</text>
    <text x="65" y="428" fill="#94a3b8" font-size="14">PROCESSING이 남을 수 있음</text>
    <text x="65" y="450" fill="#94a3b8" font-size="14">도메인 적재는 rollback</text>
    <text x="65" y="494" fill="#e2e8f0" font-size="15">복구</text>
    <text x="65" y="522" fill="#f8fafc" font-size="14">consumer group 재전달</text>
    <text x="65" y="544" fill="#f8fafc" font-size="14">ETL을 다시 실행</text>

    <rect x="425" y="320" width="350" height="260" rx="8" fill="#10251f" stroke="#34d399" stroke-width="2"/>
    <text x="450" y="357" fill="#6ee7b7" font-size="18" font-weight="700">2. ETL commit 후 중단</text>
    <text x="450" y="400" fill="#e2e8f0" font-size="15">남는 상태</text>
    <text x="450" y="428" fill="#94a3b8" font-size="14">PROCESSED + lineage 존재</text>
    <text x="450" y="450" fill="#94a3b8" font-size="14">SUCCESS 원장은 없을 수 있음</text>
    <text x="450" y="494" fill="#e2e8f0" font-size="15">복구</text>
    <text x="450" y="522" fill="#f8fafc" font-size="14">ETL 실행 생략</text>
    <text x="450" y="544" fill="#f8fafc" font-size="14">processed_event SUCCESS 보강</text>

    <rect x="810" y="320" width="350" height="260" rx="8" fill="#2a230f" stroke="#fbbf24" stroke-width="2"/>
    <text x="835" y="357" fill="#fde68a" font-size="18" font-weight="700">3. Ledger commit 후 중단</text>
    <text x="835" y="400" fill="#e2e8f0" font-size="15">남는 상태</text>
    <text x="835" y="428" fill="#94a3b8" font-size="14">processed_event SUCCESS 존재</text>
    <text x="835" y="450" fill="#94a3b8" font-size="14">Kafka offset은 미커밋</text>
    <text x="835" y="494" fill="#e2e8f0" font-size="15">복구</text>
    <text x="835" y="522" fill="#f8fafc" font-size="14">중복 처리를 생략</text>
    <text x="835" y="544" fill="#f8fafc" font-size="14">Kafka offset만 commit</text>
  </g>

  <path d="M690 209 L690 270 L215 270 L215 310" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M775 209 L775 292 L600 292 L600 310" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M970 209 L970 270 L985 270 L985 310" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="620" width="1120" height="44" rx="5" fill="#111c2d"/>
  <text x="600" y="648" fill="#cbd5e1" text-anchor="middle" font-size="15" font-family="Arial, sans-serif">FAILED와 오래된 PROCESSING은 무조건 반복하지 않고 관리자 관측 및 source별 retry policy 대상으로 분리</text>
</svg>
