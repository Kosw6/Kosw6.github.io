<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">ETL failure recovery flow</title>
  <desc id="desc">Kafka message processing, database commit, offset commit, and recovery decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="660" fill="#0b1220"/>
  <text x="48" y="55" fill="#f8fafc" font-size="30" font-family="Arial, sans-serif" font-weight="700">ETL 장애 복구 기준</text>
  <text x="48" y="87" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">DB commit 이후 Kafka offset을 commit해 미완료 작업이 재전달되도록 설계</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="50" y="135" width="170" height="76" rx="6" fill="#18243a" stroke="#60a5fa"/>
    <text x="135" y="166" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="700">Kafka 수신</text>
    <text x="135" y="190" fill="#93c5fd" text-anchor="middle" font-size="14">offset 미커밋</text>
    <rect x="270" y="135" width="170" height="76" rx="6" fill="#18243a" stroke="#60a5fa"/>
    <text x="355" y="166" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="700">PROCESSING</text>
    <text x="355" y="190" fill="#93c5fd" text-anchor="middle" font-size="14">raw 읽기</text>
    <rect x="490" y="135" width="190" height="76" rx="6" fill="#1d2f2a" stroke="#34d399"/>
    <text x="585" y="166" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="700">정규화 + lineage</text>
    <text x="585" y="190" fill="#a7f3d0" text-anchor="middle" font-size="14">한 DB 트랜잭션</text>
    <rect x="730" y="135" width="180" height="76" rx="6" fill="#1d2f2a" stroke="#34d399"/>
    <text x="820" y="166" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="700">DB COMMIT</text>
    <text x="820" y="190" fill="#a7f3d0" text-anchor="middle" font-size="14">PROCESSED + SUCCESS</text>
    <rect x="960" y="135" width="190" height="76" rx="6" fill="#30240f" stroke="#fbbf24"/>
    <text x="1055" y="166" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="700">OFFSET COMMIT</text>
    <text x="1055" y="190" fill="#fde68a" text-anchor="middle" font-size="14">메시지 완료</text>
  </g>

  <line x1="220" y1="173" x2="260" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="173" x2="480" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="173" x2="720" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="173" x2="950" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="48" y="285" fill="#f8fafc" font-size="20" font-family="Arial, sans-serif" font-weight="700">Worker가 중단된 위치에 따른 재수신 분기</text>

  <g font-family="Arial, sans-serif">
    <rect x="50" y="320" width="330" height="245" rx="8" fill="#281820" stroke="#fb7185" stroke-width="2"/>
    <text x="75" y="355" fill="#fda4af" font-size="18" font-weight="700">1. DB commit 전 중단</text>
    <text x="75" y="395" fill="#e2e8f0" font-size="16">남는 상태</text>
    <text x="75" y="423" fill="#94a3b8" font-size="15">offset 미커밋, rollback 가능</text>
    <text x="75" y="468" fill="#e2e8f0" font-size="16">복구</text>
    <text x="75" y="496" fill="#f8fafc" font-size="15">consumer group 재전달</text>
    <text x="75" y="522" fill="#f8fafc" font-size="15">다른 worker가 ETL 재처리</text>

    <rect x="435" y="320" width="330" height="245" rx="8" fill="#10251f" stroke="#34d399" stroke-width="2"/>
    <text x="460" y="355" fill="#6ee7b7" font-size="18" font-weight="700">2. DB commit 후 중단</text>
    <text x="460" y="395" fill="#e2e8f0" font-size="16">남는 상태</text>
    <text x="460" y="423" fill="#94a3b8" font-size="15">PROCESSED + lineage 존재</text>
    <text x="460" y="468" fill="#e2e8f0" font-size="16">복구</text>
    <text x="460" y="496" fill="#f8fafc" font-size="15">ETL 실행 생략</text>
    <text x="460" y="522" fill="#f8fafc" font-size="15">processed_event 보강 후 commit</text>

    <rect x="820" y="320" width="330" height="245" rx="8" fill="#2a230f" stroke="#fbbf24" stroke-width="2"/>
    <text x="845" y="355" fill="#fde68a" font-size="18" font-weight="700">3. SUCCESS 기록 후 중단</text>
    <text x="845" y="395" fill="#e2e8f0" font-size="16">남는 상태</text>
    <text x="845" y="423" fill="#94a3b8" font-size="15">processed_event SUCCESS 존재</text>
    <text x="845" y="468" fill="#e2e8f0" font-size="16">복구</text>
    <text x="845" y="496" fill="#f8fafc" font-size="15">중복 메시지로 판단</text>
    <text x="845" y="522" fill="#f8fafc" font-size="15">ETL 없이 offset commit</text>
  </g>

  <path d="M585 211 L585 270 L215 270 L215 310" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 211 L820 290 L600 290 L600 310" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1055 211 L1055 310" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="50" y="595" width="1100" height="38" rx="5" fill="#111c2d"/>
  <text x="600" y="620" fill="#cbd5e1" text-anchor="middle" font-size="15" font-family="Arial, sans-serif">FAILED와 오래된 PROCESSING은 자동 반복하지 않고 관리자 관측 및 retry policy 대상으로 분리</text>
</svg>
