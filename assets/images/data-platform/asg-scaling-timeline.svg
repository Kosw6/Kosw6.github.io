<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AWS worker ASG scaling timeline</title>
  <desc id="desc">Job lag triggers scale-out, worker handles the job, and idle timeout triggers scale-in.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#0b1220"/>
  <text x="48" y="55" fill="#f8fafc" font-size="30" font-family="Arial, sans-serif" font-weight="700">Kafka lag 기반 AWS Worker ASG</text>
  <text x="48" y="87" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">처리할 job이 있을 때 node를 기동하고, 전체 lag 0과 idle 지속 시간을 확인해 종료</text>

  <line x1="95" y1="245" x2="1100" y2="245" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif">
    <circle cx="120" cy="245" r="14" fill="#fbbf24"/>
    <rect x="45" y="130" width="210" height="85" rx="6" fill="#2a230f" stroke="#fbbf24"/>
    <text x="150" y="160" fill="#fde68a" text-anchor="middle" font-size="16" font-weight="700">JOB LAG = 1</text>
    <text x="150" y="186" fill="#f8fafc" text-anchor="middle" font-size="15">worker node 없음</text>
    <text x="150" y="205" fill="#94a3b8" text-anchor="middle" font-size="13">ASG desired=0</text>

    <circle cx="370" cy="245" r="14" fill="#34d399"/>
    <rect x="275" y="275" width="220" height="102" rx="6" fill="#10251f" stroke="#34d399"/>
    <text x="385" y="306" fill="#6ee7b7" text-anchor="middle" font-size="16" font-weight="700">SCALE_OUT #14</text>
    <text x="385" y="332" fill="#f8fafc" text-anchor="middle" font-size="15">lag threshold 충족</text>
    <text x="385" y="354" fill="#94a3b8" text-anchor="middle" font-size="13">desired 0 -> 1</text>

    <circle cx="620" cy="245" r="14" fill="#60a5fa"/>
    <rect x="520" y="130" width="230" height="85" rx="6" fill="#10223c" stroke="#60a5fa"/>
    <text x="635" y="160" fill="#93c5fd" text-anchor="middle" font-size="16" font-weight="700">WORKER IN SERVICE</text>
    <text x="635" y="186" fill="#f8fafc" text-anchor="middle" font-size="15">BLS job 소비 및 raw 수집</text>
    <text x="635" y="205" fill="#94a3b8" text-anchor="middle" font-size="13">heartbeat 갱신</text>

    <circle cx="870" cy="245" r="14" fill="#a78bfa"/>
    <rect x="770" y="275" width="230" height="102" rx="6" fill="#211a3b" stroke="#a78bfa"/>
    <text x="885" y="306" fill="#c4b5fd" text-anchor="middle" font-size="16" font-weight="700">IDLE 120s</text>
    <text x="885" y="332" fill="#f8fafc" text-anchor="middle" font-size="15">전체 topic lag=0</text>
    <text x="885" y="354" fill="#94a3b8" text-anchor="middle" font-size="13">running jobs=0</text>

    <circle cx="1080" cy="245" r="14" fill="#fb7185"/>
    <rect x="965" y="130" width="190" height="85" rx="6" fill="#2b1720" stroke="#fb7185"/>
    <text x="1060" y="160" fill="#fda4af" text-anchor="middle" font-size="16" font-weight="700">SCALE_IN #15</text>
    <text x="1060" y="186" fill="#f8fafc" text-anchor="middle" font-size="15">desired 1 -> 0</text>
    <text x="1060" y="205" fill="#94a3b8" text-anchor="middle" font-size="13">instance terminating</text>
  </g>

  <rect x="130" y="420" width="940" height="42" rx="5" fill="#111c2d"/>
  <text x="600" y="447" fill="#cbd5e1" text-anchor="middle" font-size="15" font-family="Arial, sans-serif">Scale-out: backlog 기준 | Scale-in: 모든 backlog 해소 + worker idle 지속 시간 기준</text>
</svg>
