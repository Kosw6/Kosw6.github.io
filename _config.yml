title: "Sungwon Kim"
description: "성능 개선, 실시간 시스템, 데이터 파이프라인 제어와 장애 복구를 검증하는 Backend Platform Engineer 포트폴리오"
url: "https://kosw6.github.io"
locale: "ko-KR"

remote_theme: "mmistakes/minimal-mistakes@4.26.2"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-67TSEFY9XC"
    anonymize_ip: true

minimal_mistakes_skin: "dark"

timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge

author:
  name: "Sungwon Kim"
  avatar: "/assets/images/avatar.png"
  bio: "Backend Platform Engineer focused on measurable performance, realtime systems, and recoverable data pipelines."
  location: "Seoul, Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Kosw6"

collections:
  projects:
    output: true
    permalink: /projects/:name/
  reports:
    output: true
    permalink: /reports/:name/

paginate: 8
paginate_path: "/page:num/"

include:
  - _pages

atom_feed:
  hide: true

tag_archive:
  type: liquid
  path: /tags/
